send_notification:
  name: Send notification
  description: >-
    Sends a notification through Sentinel. It is fanned out to configured
    recipients and channels according to their filters, and optionally
    created as a persistent notification requiring acknowledgement.
    Returns the notification id (and the recipients it was pushed to) when
    called with a response variable.
  fields:
    title:
      name: Title
      description: Notification title.
      required: true
      example: "Front door opened"
      selector:
        text:
    message:
      name: Message
      description: Notification message body.
      required: true
      example: "Front door sensor triggered while armed away"
      selector:
        text:
    icon:
      name: Icon
      description: >-
        An mdi: icon shown as the notification's small icon/glyph. If it's
        not an mdi: icon (and "image" is not set), it's used as the picture
        instead, for backward compatibility - prefer the separate "image"
        field for pictures going forward.
      required: false
      example: "mdi:door-open"
      selector:
        text:
    image:
      name: Image
      description: >-
        A picture to attach to the notification: an image URL, or an
        HA-relative path such as /local/... or /api/camera_proxy/.... Shown
        as the picture on companion-app push notifications, embedded in the
        message (as markdown) when "persistent" is true, and shown as a
        preview in the Lovelace card.
      required: false
      example: "/local/vacuum_map.jpg"
      selector:
        text:
    image_entity:
      name: Image entity
      description: >-
        A camera or image entity to snapshot for the picture instead of
        supplying "image" directly. Saved under
        /config/www/sentinel/notifications/<channel>/, uniquely
        named per capture, and served back as an "image" path automatically.
        Ignored if "image" is also given - an explicit "image" always wins.
        Old captures are cleaned up automatically once no stored notification
        references them anymore.
      required: false
      example: "camera.front_door"
      selector:
        entity:
          filter:
            - domain: camera
            - domain: image
    channel:
      name: Channel
      description: >-
        Configured channel key, or a list of them. Built-in channels are
        info, alert, event, reminder, security, system and chat. When several are
        given, a recipient receives the notification if it's subscribed to
        any one of them; the first channel is used for anything that can
        only carry one value (Android's notification channel, the card's
        icon color). Defaults to "default".
      required: false
      example: '["security", "event"]'
      selector:
        text:
          multiple: true
    labels:
      name: Labels
      description: >-
        Optional label key, or a list of them, to sort the notification
        further inside its channel (a "sub-channel"). Labels are defined per
        channel under Manage channels; cards can filter on them. Unknown
        labels are kept as-is.
      required: false
      example: '["front_door", "motion"]'
      selector:
        text:
          multiple: true
    importance:
      name: Importance
      description: Importance level.
      required: false
      default: "normal"
      selector:
        select:
          options:
            - "low"
            - "normal"
            - "high"
            - "critical"
    actions:
      name: Actions
      description: List of action buttons, each with "action" and "title" keys.
      required: false
      example: '[{"action": "OPEN_CAMERA", "title": "View Camera"}]'
      selector:
        object:
    persistent:
      name: Persistent
      description: >-
        If true, requires acknowledgement via the built-in persistent
        notification system.
      required: false
      default: false
      selector:
        boolean:
    data:
      name: Data
      description: Arbitrary extra fields passed through to notify.* targets.
      required: false
      selector:
        object:
    target_recipients:
      name: Target recipients
      description: >-
        Restrict delivery to these recipients only, given by their
        configured name (as shown in Manage Recipients) or their id.
        Case-insensitive. Omit to consider all recipients.
      required: false
      example: '["Henriks phone"]'
      selector:
        text:
          multiple: true
    home_only:
      name: Home only
      description: >-
        Only deliver to recipients whose assigned person entity is currently
        "home". Recipients with no person assigned are unaffected and always
        considered.
      required: false
      default: false
      selector:
        boolean:
    live_id:
      name: Live ID
      description: >-
        A stable id you choose (e.g. "vacuum_kitchen"). Calling
        send_notification again with the same live_id updates that same
        notification in place - same persistent notification, same phone
        push (via a shared tag), same history row - instead of creating a
        new one each time. Useful for a repeatedly-updated status
        notification (e.g. live vacuum-cleaning stats/map). Call
        end_live_notification with the same live_id when the live session
        is over to dismiss and clear it everywhere.
      required: false
      example: "vacuum_kitchen"
      selector:
        text:
    interactive_only:
      name: Interactive only
      description: >-
        If true, this live notification's push is auto-cleared for any
        recipient whose "interactive" entity (see Manage Recipients) has
        been off longer than the Advanced "Live notification inactivity
        timeout". Defaults to false (delivered and kept regardless of
        recipient interactivity). Meaningless without both live_id and a
        recipient's interactive entity being set, and without that Advanced
        timeout being non-zero.
      required: false
      default: false
      selector:
        boolean:
    source:
      name: Source
      description: Free-text label for what triggered this notification.
      required: false
      selector:
        text:
    show_in_history:
      name: Show in history
      description: >-
        If false, this notification is excluded from the card's History list
        and ticker, and from the "stored"/"sent" diagnostic sensors. It's
        still delivered, still counted in Unacknowledged while outstanding,
        and can still be acknowledged/ended normally - use this for frequent
        or transient updates (e.g. a live status notification) you don't
        want cluttering history. Defaults to true.
      required: false
      default: true
      selector:
        boolean:
    dismiss_on_action:
      name: Dismiss on action
      description: >-
        If false (default), pressing an action button other than Acknowledge
        (e.g. a vacuum's Pause/Resume) keeps the companion-app notification
        open instead of closing it, by marking it "sticky". Set to true to
        restore the old behavior where any action press dismisses the
        notification. Ignored (always kept open) when "persistent" is true.
      required: false
      default: false
      selector:
        boolean:
    clear_on_acknowledge:
      name: Clear on acknowledge
      description: >-
        If true (default), acknowledging this notification - from the card,
        the sentinel.acknowledge service, or the phone's own Acknowledge
        button - also clears the pushed notification on every companion-app
        recipient it reached. Set to false to leave the phone notification
        in place even after it's been acknowledged elsewhere.
      required: false
      default: true
      selector:
        boolean:
    repeat_minutes:
      name: Repeat every (minutes)
      description: >-
        Push the notification again every this many minutes until it's
        acknowledged. Only for persistent notifications; quiet hours still
        apply to each repeat.
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    repeat_count:
      name: Repeat at most
      description: >-
        Maximum number of repeats. Leave empty to repeat until acknowledged.
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 100
          mode: box

acknowledge:
  name: Acknowledge
  description: Marks a notification as acknowledged and dismisses its persistent notification, if any.
  fields:
    notification_id:
      name: Notification ID
      description: The id of the notification to acknowledge.
      required: true
      selector:
        text:

end_live_notification:
  name: End live notification
  description: >-
    Ends a live notification started via send_notification's live_id field:
    dismisses its persistent notification (if any), clears the pushed
    notification on every companion-app recipient it reached, and marks it
    acknowledged so it moves out of the Unacknowledged list. A no-op if no
    active live notification exists for that live_id.
  fields:
    live_id:
      name: Live ID
      description: The live_id used in the send_notification calls to update.
      required: true
      example: "vacuum_kitchen"
      selector:
        text:

delete_notification:
  name: Delete notification
  description: >-
    Permanently deletes one notification from history. If it's still
    outstanding (persistent and not yet acknowledged), its persistent
    notification is dismissed and any pushed companion-app notification is
    cleared first, so nothing is left dangling with no history entry behind
    it.
  fields:
    notification_id:
      name: Notification ID
      description: The id of the notification to delete.
      required: true
      selector:
        text:

clear_history:
  name: Clear history
  description: >-
    Deletes multiple notifications from history at once. By default only
    ones that aren't still actively pending acknowledgement are removed
    (the same rule the History section itself uses), so a still-outstanding
    notification is never silently lost - set include_unacknowledged to
    also delete those.
  fields:
    include_unacknowledged:
      name: Include unacknowledged
      description: >-
        If true, also delete notifications that still require
        acknowledgement and haven't gotten it yet.
      required: false
      default: false
      selector:
        boolean:

restore_config_from_snapshot:
  name: Restore config from snapshot
  description: >-
    Replaces the ENTIRE current configuration (recipients, channels,
    scheduled and calendar notifications, Advanced settings) with the
    contents of config.json - the backup snapshot Sentinel writes
    automatically alongside database.db on every Configure save. Intended
    for recovery if the config entry itself is ever lost or corrupted, not
    routine use. Admin only. The integration reloads immediately afterward, same as
    saving through Configure would.
  fields:
    confirm:
      name: Confirm
      description: >-
        Must be set to true to actually perform the restore - a safety
        check against calling this by accident, since it overwrites
        everything currently configured.
      required: true
      default: false
      selector:
        boolean:

send_chat_message:
  name: Send chat message
  description: >-
    Posts a message into a chatroom (see Manage chatrooms). Meant for
    automations/scripts, not real user-to-user chat - that's what the
    sentinel-chat-card's own composer is for. Setting sender_name and/or
    sender_icon posts as that System/bot-style identity regardless of who
    or what triggered the call - including a manual test from Developer
    Tools. Leave both blank to instead attribute the message to whichever
    real Home Assistant user triggered the call (e.g. a script you ran
    yourself), the same as one sent from the card; falls back to a plain
    "System" identity if the call has no real user behind it either (e.g.
    a purely time/state-triggered automation). Non-admin users can only post to
    chatrooms they have access to.
  fields:
    chatroom_id:
      name: Chatroom
      description: >-
        The chatroom to post to, given by its id or its configured name
        (as shown in Manage chatrooms), case-insensitively.
      required: true
      selector:
        text:
    message:
      name: Message
      description: The message text.
      required: true
      selector:
        text:
          multiline: true
    sender_name:
      name: Sender name
      description: >-
        Only used when this call has no real Home Assistant user behind it
        (see above). Defaults to "System" if left blank.
      required: false
      selector:
        text:
    sender_icon:
      name: Sender icon
      description: >-
        Only used when this call has no real Home Assistant user behind it
        (see above). An mdi: icon. Defaults to mdi:robot if left blank.
      required: false
      selector:
        text:
